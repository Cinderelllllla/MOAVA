# =====================================================================
#  MOAVA backend - application.properties
#  깃허브에 올라가는 팀 공통 설정. 비밀값은 여기 쓰지 말 것.
#  비밀값(DB 비밀번호·JWT 키·API 키)은 같은 폴더의
#  application-secret.properties 에 두고, 그 파일은 노션으로만 공유한다.
# =====================================================================

spring.application.name=moava

# 비밀 설정 파일 불러오기 (없어도 기동은 되지만 DB 접속은 실패함)
spring.config.import=optional:classpath:application-secret.properties

# ---------------------------------------------------------------------
# 1. 서버
# ---------------------------------------------------------------------
server.port=8080
# React 개발 서버(5173 또는 3000)에서 호출하므로 CORS는 SecurityConfig에서 처리

# ---------------------------------------------------------------------
# 2. Oracle DB (공통 서버 SERVER_MOAVA)
#    접속 정보(url/username/password)는 application-secret.properties
# ---------------------------------------------------------------------
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 커넥션 풀 (팀원 6명이 같은 DB를 쓰므로 1인당 풀을 작게)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------
# 3. MyBatis
# ---------------------------------------------------------------------
# XML 매퍼 위치 (resources/mapper/ 하위 전부)
mybatis.mapper-locations=classpath:mapper/**/*.xml
# DB 컬럼 MEMBER_ID -> 자바 필드 memberId 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true
# null 파라미터 타입 에러(ORA-17004) 방지
mybatis.configuration.jdbc-type-for-null=NULL
# DTO 패키지 — XML에서 resultType을 짧게 쓸 수 있음
mybatis.type-aliases-package=com.moava

# ---------------------------------------------------------------------
# 4. 로그 (개발 중 SQL 확인용. 발표 전에 INFO로 올리면 됨)
# ---------------------------------------------------------------------
logging.level.com.moava=DEBUG
logging.level.com.moava.**.mapper=TRACE
logging.level.org.springframework.security=INFO

# ---------------------------------------------------------------------
# 5. 파일 업로드 (납입 증빙 이미지)
#    backend/uploads 폴더에 저장 (.gitignore 처리됨)
#    코드에서 @Value("${moava.upload.dir}") 로 읽어 사용
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
moava.upload.dir=./uploads

# ---------------------------------------------------------------------
# 6. 시간/JSON
# ---------------------------------------------------------------------
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------
# 7. 비동기 (알림 SMS 리스너 @Async용. AsyncConfig에 @EnableAsync 필요)
# ---------------------------------------------------------------------
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.thread-name-prefix=moava-async-

# ---------------------------------------------------------------------
# 8. JWT
#    서명 키(moava.jwt.secret)는 application-secret.properties
#    코드에서 @Value("${moava.jwt.secret}") 로 읽어 사용
# ---------------------------------------------------------------------
# 토큰 만료(분). 발표 당일엔 1440(24시간)으로 올려도 됨
moava.jwt.expire-minutes=120

# ---------------------------------------------------------------------
# 9. 외부 연동
#    API 키는 전부 application-secret.properties
# ---------------------------------------------------------------------
# 연체 확률 모델 (FastAPI). ML 담당이 로컬에서 띄우는 주소
moava.ml.base-url=http://localhost:8000

# Elasticsearch (pom에 의존성 추가되면 주석 해제)
# spring.elasticsearch.uris=http://localhost:9200