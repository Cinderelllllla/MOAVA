# =====================================================================
#  MOAVA backend - application.properties
#  깃허브에 올라가는 팀 공통 설정. 비밀값은 여기 쓰지 말 것.
#  비밀값(DB 비밀번호·JWT 키·API 키)은 같은 폴더의
#  application-secret.properties 에 두고, 그 파일은 노션으로만 공유한다.
# =====================================================================

spring.application.name=moava

# 비밀 설정 파일 불러오기 (없어도 기동은 되지만 DB 접속은 실패함)
spring.config.import=optional:classpath:application-secret.properties

# ---------------------------------------------------------------------
# 1. 서버
# ---------------------------------------------------------------------
server.port=8080
# React 개발 서버(5173 또는 3000)에서 호출하므로 CORS는 SecurityConfig에서 처리

# ---------------------------------------------------------------------
# 2. Oracle DB (공통 서버 SERVER_MOAVA)
#    접속 정보(url/username/password)는 application-secret.properties
# ---------------------------------------------------------------------
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 커넥션 풀 (팀원 6명이 같은 DB를 쓰므로 1인당 풀을 작게)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------
# 3. MyBatis
# ---------------------------------------------------------------------
# XML 매퍼 위치 (resources/mapper/ 하위 전부)
mybatis.mapper-locations=classpath:mapper/**/*.xml
# DB 컬럼 MEMBER_ID -> 자바 필드 memberId 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true
# null 파라미터 타입 에러(ORA-17004) 방지
mybatis.configuration.jdbc-type-for-null=NULL
# DTO 패키지 — XML에서 resultType을 짧게 쓸 수 있음
mybatis.type-aliases-package=com.moava

# ---------------------------------------------------------------------
# 4. 로그 (개발 중 SQL 확인용. 발표 전에 INFO로 올리면 됨)
# ---------------------------------------------------------------------
logging.level.com.moava=DEBUG
logging.level.com.moava.**.mapper=TRACE
logging.level.org.springframework.security=INFO

# F19 - 계좌 관련 민감정보 SQL 로그 노출 방지
logging.level.com.moava.group.account.mapper=INFO
logging.level.com.moava.group.create.mapper=INFO
logging.level.com.moava.openbanking.mapper=INFO
logging.level.com.moava.openbanking.codef=INFO

# ---------------------------------------------------------------------
# 5. 파일 업로드 (납입 증빙 이미지)
#    backend/uploads 폴더에 저장 (.gitignore 처리됨)
#    코드에서 @Value("${moava.upload.dir}") 로 읽어 사용
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
moava.upload.dir=./uploads

# ---------------------------------------------------------------------
# 6. 시간/JSON
# ---------------------------------------------------------------------
spring.jackson.time-zone=Asia/Seoul

# ---------------------------------------------------------------------
# 7. 비동기 (알림 SMS 리스너 @Async용. AsyncConfig에 @EnableAsync 필요)
# ---------------------------------------------------------------------
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.thread-name-prefix=moava-async-

# ---------------------------------------------------------------------
# 8. JWT
#    서명 키(moava.jwt.secret)는 application-secret.properties
#    코드에서 @Value("${moava.jwt.secret}") 로 읽어 사용
# ---------------------------------------------------------------------
# 토큰 만료(분). 발표 당일엔 1440(24시간)으로 올려도 됨
moava.jwt.expire-minutes=120

# ---------------------------------------------------------------------
# 9. 외부 연동
#    API 키는 전부 application-secret.properties
# ---------------------------------------------------------------------
# 연체 확률 모델 (FastAPI). ML 담당이 로컬에서 띄우는 주소
moava.ml.base-url=http://localhost:8000

# Elasticsearch (pom에 의존성 추가되면 주석 해제)
# spring.elasticsearch.uris=http://localhost:9200

# 소셜 로그인 인증 세션 설정
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=15m

# Elasticsearch (F11/F12 moava_group 인덱스 — 미실행·장애 시 DB LIKE 폴백)
moava.elasticsearch.enabled=true
moava.elasticsearch.base-url=http://localhost:9200
moava.elasticsearch.index-name=moava_group
moava.elasticsearch.sync-on-startup=true

# 오픈뱅킹 간편연결(1원 인증) OAuth 콜백 URI (배포 환경에서는 환경변수로 덮어쓰기)
moava.openbanking.quick-oauth-redirect-uri=http://localhost:3000/openbanking/bank-auth

# F20 모임 계좌 변경 ↔ 모의은행(MOCK_KFTC_ACCOUNT) 은행명-3자리 은행코드 매핑
moava.f20.bank-code-map=산업은행=002,KDB산업은행=002,한국산업은행=002,기업은행=003,IBK기업은행=003,국민은행=004,KB국민은행=004,수협은행=007,Sh수협은행=007,SH수협은행=007,농협은행=011,NH농협은행=011,농협=011,우리은행=020,SC제일은행=023,제일은행=023,씨티은행=027,한국씨티은행=027,iM뱅크(대구)=031,iM뱅크=031,대구은행=031,부산은행=032,BNK부산은행=032,광주은행=034,제주은행=035,전북은행=037,경남은행=039,BNK경남은행=039,새마을금고=045,MG새마을금고=045,신협=048,우체국=071,우체국예금=071,하나은행=081,KEB하나은행=081,신한은행=088,케이뱅크=089,카카오뱅크=090,토스뱅크=092


