name: MOAVA CI (Develop)

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 어떤 폴더가 변경되었는지 감지 (workflow_dispatch 수동 실행 시 전체 실행)
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            ml:
              - 'ml/**'

  backend-test:
    name: Backend Test (Java 17 / Maven)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Maven tests
        run: ./mvnw -B test

  frontend-build:
    name: Frontend Build (Node / Vite)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  ml-syntax-check:
    name: ML Syntax Check (Python 3.11)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        # ml/src 폴더가 없다면 src 대신 . 으로 변경하세요
        run: python -m compileall -q src
